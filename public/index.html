<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Deck Builder - UPTC (Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mtg: { gold: '#C5A059', dark: '#111111', card: '#1A1A1A', accent: '#333333' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-mtg-dark text-gray-200 font-sans min-h-screen relative">

    <nav class="bg-black border-b border-mtg-gold p-4 sticky top-0 z-40">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-bold text-mtg-gold tracking-tighter cursor-pointer" onclick="updateUIState()">Deck<span class="text-white">Builder</span></h1>
            <div id="userInfo" class="flex items-center gap-4 hidden">
                <span id="welcomeMessage" class="font-medium text-sm md:text-base"></span>
                <button onclick="logout()" class="bg-red-900 hover:bg-red-800 text-white px-4 py-2 rounded-lg text-sm transition">Salir</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6 md:p-10">
        
        <section id="authSection" class="flex flex-col md:flex-row gap-10 justify-center items-center py-10 md:py-20">
            <div class="bg-mtg-card p-8 rounded-2xl border border-gray-800 w-full max-w-md shadow-xl">
                <h2 class="text-2xl font-semibold text-mtg-gold mb-6">Iniciar Sesión</h2>
                <div class="space-y-4">
                    <input type="text" id="loginUser" placeholder="Usuario" class="w-full p-3 rounded-lg bg-mtg-dark border border-gray-700 focus:border-mtg-gold outline-none text-white">
                    <input type="password" id="loginPass" placeholder="Contraseña" class="w-full p-3 rounded-lg bg-mtg-dark border border-gray-700 focus:border-mtg-gold outline-none text-white">
                    <button onclick="handleLogin()" class="w-full bg-mtg-gold text-black font-bold p-3 rounded-lg hover:bg-yellow-600 transition">Entrar al Multiverso</button>
                </div>
            </div>
            
            <div class="text-gray-600 text-xl font-bold hidden md:block">Ó</div>
            
            <div class="bg-mtg-card p-8 rounded-2xl border border-gray-800 w-full max-w-md shadow-xl">
                <h2 class="text-2xl font-semibold text-white mb-6">Registrarse</h2>
                <div class="space-y-4">
                    <input type="text" id="regUser" placeholder="Nuevo Usuario" class="w-full p-3 rounded-lg bg-mtg-dark border border-gray-700 focus:border-mtg-gold outline-none text-white">
                    <input type="password" id="regPass" placeholder="Nueva Contraseña" class="w-full p-3 rounded-lg bg-mtg-dark border border-gray-700 focus:border-mtg-gold outline-none text-white">
                    <button onclick="handleRegister()" class="w-full bg-mtg-accent text-white font-bold p-3 rounded-lg hover:bg-gray-700 transition">Crear Cuenta</button>
                </div>
            </div>
        </section>

        <section id="dashboardSection" class="hidden space-y-8">
            <div class="flex justify-between items-end border-b border-gray-700 pb-4">
                <div class="flex gap-4">
                    <h2 class="text-2xl font-light text-white bg-gray-800 px-4 py-2 rounded-t-lg border-b-2 border-mtg-gold">All Decks</h2>
                </div>
                <button onclick="toggleCreateDeckForm()" class="bg-mtg-gold text-black px-4 py-2 rounded font-bold hover:bg-yellow-600 transition text-sm">
                    + Nuevo Mazo
                </button>
            </div>

            <div id="createDeckForm" class="hidden bg-[#1A1A1A] p-6 rounded-lg border border-gray-800 shadow-xl transition-all duration-300">
                <div class="grid md:grid-cols-4 gap-4">
                    <input type="text" id="newDeckName" placeholder="Name" class="w-full p-2 rounded bg-mtg-dark border border-gray-700 outline-none text-white text-sm">
                    <input type="text" id="newDeckFormat" placeholder="Format (Ej: Pauper)" class="w-full p-2 rounded bg-mtg-dark border border-gray-700 outline-none text-white text-sm">
                    <input type="text" id="newDeckDesc" placeholder="Description" class="w-full p-2 rounded bg-mtg-dark border border-gray-700 md:col-span-2 outline-none text-white text-sm">
                    <button onclick="handleCreateDeck()" class="bg-mtg-gold text-black font-bold p-2 rounded hover:bg-yellow-600 transition md:col-span-4 text-sm">Guardar Mazo</button>
                </div>
            </div>

            <div class="overflow-x-auto bg-[#1A1A1A] rounded border border-gray-800 shadow-xl">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead>
                        <tr class="bg-[#222222] border-b border-gray-700 text-xs text-gray-400 font-bold uppercase tracking-wider">
                            <th class="p-4">Name</th>
                            <th class="p-4">Format</th>
                            <th class="p-4">Creation Date</th>
                            <th class="p-4">Visibility</th>
                            <th class="p-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="decksTableBody" class="text-sm">
                        </tbody>
                </table>
            </div>
        </section>

        <section id="deckViewSection" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <button onclick="backToDashboard()" class="text-gray-400 hover:text-mtg-gold transition flex items-center gap-2 font-medium text-sm">
                    &larr; Volver a Decks
                </button>
                <span id="editModeBadge" class="hidden bg-red-900 text-white text-xs px-3 py-1 rounded font-bold animate-pulse uppercase tracking-tighter">Editando Mazo</span>
            </div>
            
            <div class="bg-[#1A1A1A] p-8 rounded border border-gray-800 shadow-xl flex flex-col md:flex-row gap-10">
                <div class="flex-1">
                    <div class="flex justify-between items-start mb-2 gap-4">
                        <div id="deckTitleContainer" class="flex-1">
                            <h2 id="viewDeckName" class="text-3xl font-bold text-white truncate"></h2>
                        </div>
                        
                        <div class="flex gap-3 whitespace-nowrap">
                            <button id="saveDeckBtn" onclick="handleSaveDeckDetails()" class="hidden bg-green-600 text-white px-4 py-1.5 rounded font-bold hover:bg-green-500 transition text-sm flex items-center gap-2 shadow-[0_0_15px_rgba(22,163,74,0.4)]">
                                &#10003; Guardar Cambios
                            </button>
                            <button onclick="downloadDeckTxt()" class="bg-gray-800 border border-gray-600 text-white px-3 py-1.5 rounded font-bold hover:bg-gray-700 transition text-sm">
                                Exportar .txt
                            </button>
                            <button id="addCardMainBtn" onclick="openAddCardModal()" class="hidden bg-mtg-gold text-black px-3 py-1.5 rounded font-bold hover:bg-yellow-600 transition text-sm shadow-[0_0_15px_rgba(197,160,89,0.3)]">
    + Agregar Carta
</button>
                        </div>
                    </div>
                    
                    <div id="deckMetaContainer" class="mb-6 space-y-2">
                        <p id="viewDeckFormat" class="text-sm text-mtg-gold uppercase tracking-widest font-bold"></p>
                        <p id="viewDeckDesc" class="text-gray-400 text-sm italic"></p>
                    </div>
                    
                    <div class="bg-mtg-dark p-4 rounded border border-gray-800">
                        <div id="viewDeckCards" class="space-y-1"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="addCardModal" class="fixed inset-0 bg-black bg-opacity-80 flex justify-center items-center z-50 hidden transition-opacity duration-300 opacity-0">
        <div class="bg-mtg-card p-8 rounded-2xl border border-mtg-gold shadow-2xl w-full max-w-lg mx-4">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-medium text-mtg-gold">Agregar Carta a: <br><span id="modalDeckName" class="text-white text-base"></span></h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-white text-3xl font-bold leading-none">&times;</button>
            </div>
            
            <div class="space-y-5">
                <div class="relative space-y-2">
                    <label class="text-xs text-gray-500 font-bold uppercase tracking-wider">Buscar Carta (Nombre en Inglés)</label>
                    <input type="text" id="searchCardInput" placeholder="Ej: Black Lotus, Lightning Bolt..." class="w-full p-3 rounded-lg bg-mtg-dark border border-gray-700 outline-none focus:border-mtg-gold text-white text-sm" autocomplete="off">
                    
                    <div id="autocompleteResults" class="absolute left-0 right-0 top-full mt-1 bg-[#222222] border border-gray-700 rounded-lg shadow-2xl z-50 max-h-60 overflow-y-auto hidden">
                        </div>
                </div>

                <div class="flex items-center gap-4 pt-2">
                    <label class="text-gray-400 whitespace-nowrap text-sm">Cantidad:</label>
                    <input type="number" id="addCardQty" value="1" min="1" class="w-1/3 p-3 rounded-lg bg-mtg-dark border border-gray-700 outline-none text-white font-mono">
                </div>
                
                <button id="addCardSubmitBtn" class="w-full bg-mtg-gold text-black font-bold p-3 rounded-lg hover:bg-yellow-600 transition flex justify-center items-center gap-2 mt-4 text-sm shadow-md disabled:opacity-50">
                    <span id="btnText">Consultar Scryfall y Agregar</span>
                    <div id="btnSpinner" class="animate-spin rounded-full h-5 w-5 border-b-2 border-black hidden"></div>
                </button>
            </div>
        </div>
    </div>

    <img id="cardHoverPreview" src="" class="fixed z-50 w-60 rounded-xl shadow-2xl pointer-events-none hidden transition-opacity duration-200 border-2 border-black" alt="Card preview">

    <script src="js/app.js"></script>
</body>
</html>
